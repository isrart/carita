name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 15 trae Xcode 16 (Swift 6, SDK con Swift Charts y SwiftUI de macOS 13+);
    # build.sh compila en modo -swift-version 5
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh usa el número de commits como número de build; el changelog, las etiquetas

      - name: Elegir Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swiftc --version

      - name: Comprobar que la etiqueta coincide con VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con VERSION ($v)"
            exit 1
          fi

      - name: Preparar la firma propia
        # el mismo certificado que en el Mac de Isra: así macOS no olvida los permisos al actualizar
        env:
          P12: ${{ secrets.CARITA_P12 }}
          P12_PASS: ${{ secrets.CARITA_P12_PASS }}
        run: |
          if [ -z "$P12" ]; then echo "Sin certificado: se firmará ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/carita-firma.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/firma.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain .github/carita-firma.pem
          printf '%s' "$KCPASS" > "$RUNNER_TEMP/kc.pass"
          rm "$RUNNER_TEMP/firma.p12"
          echo "CARITA_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "CARITA_KEYCHAIN_PASS_FILE=$RUNNER_TEMP/kc.pass" >> "$GITHUB_ENV"

      - name: Compilar Carita.app
        run: bash build.sh

      - name: Empaquetar
        # ditto conserva la firma (ad hoc) y los atributos; zip a secas la rompería
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Carita.app Carita.zip
          codesign --verify --deep --strict Carita.app && echo "firma OK"
          codesign -d -r- Carita.app 2>&1 | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: Carita
          path: build/Carita.zip

      - name: Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          {
            echo "## Novedades"
            echo
            git log --no-merges --format='- %s' "$range"
            echo
            echo "## Instalar"
            echo
            echo "1. Descarga **Carita.zip**, descomprímelo y mueve **Carita.app** a tu carpeta Aplicaciones (o ~/Applications)."
            echo "2. La primera vez, **clic derecho → Abrir** (no está firmada por Apple). Si macOS no te deja, ejecuta:"
            echo '   `xattr -dr com.apple.quarantine ~/Applications/Carita.app`'
            echo "3. Menú del bichito → **Diagnóstico… → Reinstalar hooks** para conectarla con Claude Code."
          } > notes.md
          cat notes.md

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Carita.zip \
            --title "Carita ${GITHUB_REF_NAME#v}" --notes-file notes.md
